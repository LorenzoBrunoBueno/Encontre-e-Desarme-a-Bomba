name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  test_game3d:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Test game-3d (unit + e2e)
    # Job separado, não bloqueia o deploy (build_and_deploy_job roda em
    # paralelo) — os testes existiam (keypad.spec.js, depois full-loop.spec.js)
    # mas nada em CI rodava npm run test:e2e/test:unit até aqui.
    defaults:
      run:
        working-directory: ./game-3d
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Unit tests (difficulty.js)
        run: npm run test:unit
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E tests (IWER)
        run: npm run test:e2e

  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # /frontend (estático) e /game-3d (Vite) têm bundlers/etapas de build
      # diferentes — combinados aqui em /dist por scripts/build-static.mjs
      # (ver frontend/instrucao.md) antes de entregar pro Oryx, que só
      # precisa fazer upload do resultado (skip_app_build abaixo) e buildar
      # a API (/api, um simples `npm install` de Azure Functions).
      - name: Build frontend + game-3d
        run: npm run build
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_RED_ISLAND_066E0F60F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          # Com skip_app_build: true, a action NÃO combina app_location +
          # output_location — ela procura o index.html direto dentro de
          # app_location. Por isso aponta já pra pasta buildada (/dist),
          # não pra raiz do repo; output_location não se aplica aqui.
          app_location: "/dist" # App source code path (já buildado pelo passo acima)
          api_location: "/api" # Api source code path - optional
          skip_app_build: true # já buildado pelo passo "Build frontend + game-3d" acima
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_RED_ISLAND_066E0F60F }}
          action: "close"
